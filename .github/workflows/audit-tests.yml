name: Jarvis audit tests
on:
  push:
    branches: [feat/jarvis-v3, codex/jarvis-v3-audit, codex/jarvis-ultimate-v4]
  pull_request:
    branches: [feat/jarvis-v3]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt -r requirements-desktop.txt
      - run: python -m pytest -q -ra tests/test_desktop_core.py tests/test_desktop_voice.py tests/test_desktop_ui.py tests/test_desktop_personal.py tests/test_local_recovery.py tests/test_local_chat_runtime.py tests/test_model_runtime.py
      - run: python desktop_app.py --smoke-test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build.ps1 -PythonPath (Get-Command python).Source -PortableOnly -OutputDir "$env:RUNNER_TEMP/jarvis-desktop"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $built = "$env:RUNNER_TEMP/jarvis-desktop/portable/JarvisDesktop/JarvisDesktop.exe"
          $check = Start-Process -FilePath $built -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Packaged application failed smoke verification' }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: ${{ runner.temp }}/jarvis-desktop/portable/JarvisDesktop
          retention-days: 7
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: node --check webapp/static/app.js && node --check webapp/static/v4.js && node --check webapp/static/deadlines.js && node --check webapp/static/assistant.js
      - run: python -m pytest -q -ra -m "not postgres"
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jarvis_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -ra
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/jarvis_audit_test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_v4_browser.py
        env:
          RUN_BROWSER_TESTS: '1'
